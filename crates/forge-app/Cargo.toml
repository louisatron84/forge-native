[package]
name = "forge-app"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
gpui-kit = "0.9.0"
forge-text = { path = "../forge-text" }
forge-core = { path = "../forge-core" }
forge-sys = { path = "../forge-sys" }
forge-term = { path = "../forge-term" }
forge-run = { path = "../forge-run" }
forge-lsp = { path = "../forge-lsp" }
forge-dap = { path = "../forge-dap" }
forge-update = { path = "../forge-update" }
forge-scan = { path = "../forge-scan" }
serde_json = "1"
regex = "1"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
gpui = { package = "gpui-pre", version = "=0.3.11", features = ["test-support"] }
